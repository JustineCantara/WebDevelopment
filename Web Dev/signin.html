<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – WebPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="auth-page">

    <!-- ===== LEFT: brand / message panel ===== -->
    <section class="auth-side">
      <a href="index.html" class="auth-sidelogo">WAYPA</a>
      <div class="auth-sideinner">
        <h1 class="auth-sidetitle">Discover your ideal web development career path</h1>
        <p class="auth-sidetext">A career preference system built for BSIT graduates in the Philippines.</p>
      </div>
    </section>

    <!-- ===== RIGHT: sign in form ===== -->
    <section class="auth-form-side">
      <div class="auth-card">
        <h2 class="auth-cardtitle">Welcome Back!</h2>
        <p class="auth-cardsubtitle">Sign in to continue your learning journey.</p>

        <p class="auth-form-status" id="formStatus" role="status" aria-live="polite"></p>

        <form id="signinForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <span class="field-error-msg" id="emailError"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <span class="field-error-msg" id="passwordError"></span>
          </div>
<div class="field-helper-row">
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit">Sign In</button>

          <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>
      </div>
    </section>

  </main>

  <script src="auth.js"></script>
</body>
</html>
